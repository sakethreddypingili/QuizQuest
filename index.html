<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="QuizQuest - Test your knowledge across multiple categories." />
  <title>QuizQuest – Trivia Challenge</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>QuizQuest</h1>
      <p>Test your intelligence</p>
    </div>
  </header>

  <main class="container">
    <!-- Welcome settings panel -->
    <section id="welcome-panel" class="card">
      <h2>Welcome Settings</h2>
      <form id="quiz-settings-form" novalidate>
        <label for="question-count">Number of Questions (1-50):</label>
        <input type="number" id="question-count" min="1" max="50" value="10" />

        <label for="question-category">Category:</label>
        <select id="question-category">
          <option value="">Any Category</option>
          <option value="9">General Knowledge</option>
          <option value="21">Sports</option>
          <option value="23">History</option>
        </select>

        <button type="submit" id="btn-start-quiz" class="btn">Start Quiz</button>
      </form>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="card hidden">
      <div class="quiz-header">
        <span id="question-progress">Question 1 of 10</span>
        <span id="timer-display">Time: 15s</span>
      </div>
      <h3 id="question-text">Question content will load here...</h3>
      <div id="choices-container" class="choices-grid"></div>
    </section>

    <!-- Score Statistics Grids -->
    <section id="results-screen" class="card hidden">
      <h2>Quiz Results</h2>
      <div class="score-grid">
        <div class="score-card">
          <h4>Total Score</h4>
          <p id="final-score">8/10</p>
        </div>
        <div class="score-card">
          <h4>Percentage</h4>
          <p id="final-percentage">80%</p>
        </div>
      </div>
      <table id="performance-table" class="performance-table">
        <thead>
          <tr>
            <th>No.</th>
            <th>Category</th>
            <th>Result</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="JS/app.js"></script>
  <script src="JS/state.js"></script>
</body>
</html>
